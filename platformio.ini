; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3_supermini

[env:teensy40]
platform = teensy@5.2.0
board = teensy40
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<bringup/> -<diagnostics/> -<esp32/>

lib_deps =
    adafruit/Adafruit ICM20X@2.0.7
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15

; Preparation build only: USB/memory/bus setup, without acquisition or SD writes.
; Base board is N8; every memory setting below targets the OEM FH4R2 instead.
[env:esp32s3_supermini]
platform = espressif32@7.1.3
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; ARDUINO_USB_MODE=1 is inherited: native USB Serial/JTAG CDC, not UART.
build_src_filter = -<*> +<bringup/esp32s3_setup.cpp>
lib_ignore = Audio
lib_deps =
    greiman/SdFat@2.3.1

; Independent diagnostic: starts writing only after serial command 's'.
[env:esp32s3_sd_test]
extends = env:esp32s3_supermini
build_src_filter = -<*> +<diagnostics/esp32s3_sd_test.cpp>

; Integrated raw sensor acquisition: core 1 -> bounded queue -> SD on core 0.
; Kept explicit while the new prototype and SD stability are being validated.
[env:esp32s3_acquisition]
extends = env:esp32s3_supermini
lib_ignore =
    Audio
    SD
build_src_filter =
    -<*>
    +<esp32/>
    +<drivers/pca9548a.cpp>
    +<drivers/icm20948.cpp>
    +<drivers/bmp390.cpp>
    +<services/imu_acquisition.cpp>
    +<services/sd_logger.cpp>
    +<utils/>
lib_deps =
    ${env:esp32s3_supermini.lib_deps}
    adafruit/Adafruit ICM20X@2.0.7
    adafruit/Adafruit BMP3XX Library@2.1.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
